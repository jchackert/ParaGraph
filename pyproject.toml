[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "paragraph"
version = "0.2.0"
description = "Claude Code skill — turn any folder of code, docs, papers, images, or videos into a queryable knowledge graph"
readme = "README.md"
license = { file = "LICENSE" }
keywords = ["claude", "claude-code", "knowledge-graph", "rag", "graphrag", "tree-sitter", "leiden"]
requires-python = ">=3.10,<3.14"
# Hard deps cover this fork's real corpus: Swift app, Python scripts, JS/TS docs.
# All other grammars are optional — install with `paragraph[languages]`.
# A missing grammar degrades gracefully: that language is skipped with a note
# in the extraction output ("<module> not installed"), never a crash.
dependencies = [
    "networkx",
    "tree-sitter>=0.23.0",
    "tree-sitter-python",
    "tree-sitter-swift",
    "tree-sitter-javascript",
    "tree-sitter-typescript",
]

[project.urls]
Homepage = "https://github.com/jchackert/ParaGraph"
Repository = "https://github.com/jchackert/ParaGraph"
Issues = "https://github.com/jchackert/ParaGraph/issues"

[project.optional-dependencies]
languages = [
    "tree-sitter-go",
    "tree-sitter-rust",
    "tree-sitter-java",
    "tree-sitter-c",
    "tree-sitter-cpp",
    "tree-sitter-ruby",
    "tree-sitter-c-sharp",
    "tree-sitter-kotlin",
    "tree-sitter-scala",
    "tree-sitter-php",
    "tree-sitter-lua",
    "tree-sitter-objc",
]
mcp = ["mcp>=1.2,<2"]
link = ["numpy"]
neo4j = ["neo4j"]
pdf = ["pypdf", "html2text"]
watch = ["watchdog"]
leiden = ["graspologic; python_version < '3.13'"]
office = ["python-docx", "openpyxl"]
video = ["faster-whisper", "yt-dlp"]
all = [
    "paragraph[languages]",
    "mcp>=1.2,<2", "numpy", "neo4j", "pypdf", "html2text", "watchdog",
    "graspologic; python_version < '3.13'",
    "python-docx", "openpyxl", "faster-whisper", "yt-dlp",
]

[project.scripts]
paragraph = "paragraph.__main__:main"

[tool.uv]
package = true

[tool.setuptools.packages.find]
where = ["."]
include = ["paragraph*"]

[tool.setuptools.package-data]
paragraph = ["skill.md", "standards/*.json"]
